# IG Monitor 설정 — LKM / eBPF 구조
daemonize = 1
log_file = /var/log/ig_monitor.log
syslog = 0
verbose = 0

# eBPF who-data 추적 (kernel 5.8+에서만 실제 활성화됨)
# 0으로 설정하면 커널 버전 무관하게 비활성
ebpf = 1

[watch]
# 무결성 핵심 파일만 감시 — 기본 모드 lock(DENY)에서 안전한 대상.
# ⚠ /etc 전체(recursive)는 넣지 말 것: OS가 평상시 쓰는 파일(resolv.conf·adjtime 등)까지
#   차단돼 sudo·데몬이 죽는다. /etc 전체 가시성이 필요하면 maintenance 모드(+eBPF 권장).
/etc/passwd  = single
/etc/shadow  = single
/etc/group   = single
/etc/gshadow = single
/etc/sudoers = single
/etc/ssh     = recursive
/etc/crontab = single
/usr/bin     = single

[protect]
/usr/local/bin/agent = file
/etc/ig_monitor/ig.conf = file
